name: Translation
description: An inaccurate or odd translation of the interface
labels: [translation]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [Russian, English, Ukrainian, German, French, Japanese, Chinese]
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Where and what is wrong
      description: The current text and the correct one
    validations:
      required: true
