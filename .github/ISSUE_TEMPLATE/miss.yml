name: Miss in game
description: The solution missed the target in game
labels: [miss]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! These reports are how tables become "verified in game".
  - type: input
    id: weapon
    attributes:
      label: Weapon and shell
      placeholder: M101 (105 mm), HE
    validations:
      required: true
  - type: input
    id: map
    attributes:
      label: Map
      placeholder: Altis
  - type: textarea
    id: inputs
    attributes:
      label: Inputs
      description: Distance, azimuth, heights, charge, trajectory
      placeholder: "Distance 2350 m, gun height 120 m, target height 85 m, charge 2, HIGH"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened
      description: Over or short, by how many metres
      placeholder: "Short by ~80 m"
    validations:
      required: true
  - type: dropdown
    id: drag
    attributes:
      label: Air resistance in game (ACE advanced ballistics)
      options:
        - "Off"
        - "On"
        - Don't know
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.14.0
