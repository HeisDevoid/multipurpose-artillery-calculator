name: Table error
description: A value in the app differs from the in-game table
labels: [table]
body:
  - type: input
    id: weapon
    attributes:
      label: Weapon, mode, charge
      placeholder: Seara, HIGH, charge 6
    validations:
      required: true
  - type: textarea
    id: rows
    attributes:
      label: Rows that differ
      description: In game vs in the app
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot of the in-game table
      description: Drag the image here
    validations:
      required: true
