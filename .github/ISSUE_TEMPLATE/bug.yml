name: App bug
description: Something does not work or the app crashed
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the map Stratis
2. ..."
  - type: textarea
    id: report
    attributes:
      label: Error report
      description: If the error screen appeared, press "Copy report" and paste it here
      render: text
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "Windows 10, Chrome 130 / Android, desktop app 0.14.0"
