name: Stats

# The stats picture for the README: once a day and by hand. It goes to the stats branch
# (a single commit, rewritten every time) together with history.json, the daily readings
# of the usage counters. The README takes the picture from there.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  stats:
    name: Render stats
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/stats

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The app downloads one of these files once a day per device; GitHub counts the
      # downloads. A pre-release never becomes "latest", so the app updater is not affected.
      - name: Usage counters release (created once)
        run: |
          if gh release view usage --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          mkdir counters
          for name in web desktop; do
            printf 'Artillery Calculator usage counter: %s\n' "$name" > "counters/$name.txt"
          done
          gh release create usage counters/web.txt counters/desktop.txt \
            --repo "$GITHUB_REPOSITORY" --target main --prerelease --latest=false \
            --title "Usage counters" \
            --notes "Not a version of the app. The site and the Windows app download one of these files once a day per device, and the download counts become the chart in the README. Nothing about the user or the device is sent. The counter can be turned off in the settings (Anonymous statistics)."

      # Without the earlier readings the chart would start over, so a branch that cannot be
      # read stops the run instead of overwriting it
      - name: Earlier readings
        run: |
          mkdir -p out
          code=0
          git ls-remote --exit-code --heads "$REMOTE" stats >/dev/null || code=$?
          if [ "$code" = 0 ]; then
            git fetch -q --depth 1 "$REMOTE" stats
            git show FETCH_HEAD:history.json > out/history.json 2>/dev/null || rm -f out/history.json
          elif [ "$code" != 2 ]; then
            echo "Cannot read the stats branch" >&2
            exit 1
          fi

      - name: Render
        run: node .github/stats/render.mjs out/stats.svg out/history.json

      - name: Publish to the stats branch
        working-directory: out
        run: |
          git init -q -b stats
          git add stats.svg
          if [ -f history.json ]; then git add history.json; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "stats"
          git push -q --force "$REMOTE" stats:stats
