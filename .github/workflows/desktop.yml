name: Desktop app

# Builds the Windows app (Tauri). The finished installer is in the
# "artillery-calculator-windows" artifact on the run page.
# A version tag (v0.10.0) also publishes the installer to GitHub Releases.
# A local build needs Rust and the Visual Studio Build Tools (C++).

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'web/**'
      - '.github/workflows/desktop.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The auto-update files (.sig) are signed with the key from the secret
      # TAURI_SIGNING_PRIVATE_KEY; without the secret a plain installer is built.
      - name: Build desktop app
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # The signing variables are set only when the key exists: the bundler would take empty ones for a key
          if [ -n "$SIGNING_KEY" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$SIGNING_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
            npm run desktop:build -- --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without update files"
            npm run desktop:build
          fi

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: artillery-calculator-windows
          path: |
            web/src-tauri/target/release/bundle/nsis/*.exe
            web/src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  release:
    name: Publish release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: artillery-calculator-windows
          path: installer

      # Names without spaces (GitHub would replace them with dots) and latest.json for
      # the auto-update: the version, the signature and the installer address in this release
      - name: Prepare update manifest
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd installer
          for f in *; do mv "$f" "${f// /}"; done
          ls -la
          node -e '
            const fs = require("fs")
            const exe = fs.readdirSync(".").find((f) => f.endsWith("-setup.exe"))
            const sig = exe + ".sig"
            if (!fs.existsSync(sig)) { console.log("no signature: latest.json skipped"); process.exit(0) }
            const version = process.env.TAG.replace(/^v/, "")
            const manifest = {
              version,
              notes: "https://github.com/" + process.env.REPO + "/releases/tag/" + process.env.TAG,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: fs.readFileSync(sig, "utf8").trim(),
                  url: "https://github.com/" + process.env.REPO + "/releases/download/" + process.env.TAG + "/" + exe,
                },
              },
            }
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2))
            console.log(manifest)
          '

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            installer/*.exe
            installer/*.sig
            installer/latest.json
          generate_release_notes: true
